name: Build IGDownloader.dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylibs (arm64, iOS 14+)
        continue-on-error: true
        run: |
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          : > build/build.log
          for n in IGDownloader IGConfirm IGGhost IGNoAds IGLock IGSeen; do
            echo "== $n ==" | tee -a build/build.log
            (xcrun --sdk iphoneos clang \
              -arch arm64 -miphoneos-version-min=14.0 -isysroot "$SDK" \
              -fobjc-arc -dynamiclib -Os -Wall -Wno-deprecated-declarations \
              -framework UIKit -framework Foundation -framework AVFoundation \
              -framework Photos -framework CoreGraphics -framework QuartzCore \
              -framework LocalAuthentication \
              -install_name @rpath/$n.dylib \
              -o build/$n.dylib src/$n.m && codesign -f -s - build/$n.dylib && echo "OK $n") 2>&1 | tee -a build/build.log
          done
          ls -la build | tee -a build/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: dylibs
          path: build/*.dylib
          if-no-files-found: ignore

      - name: Commit built dylib + log to dist/
        if: always()
        run: |
          mkdir -p dist
          cp build/build.log dist/build.log || true
          rm -f dist/*.dylib; cp build/*.dylib dist/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "build: dylibs [skip ci]"
          git push
